-- ============================================================================
-- TEMAS E CORES (Centralizado para fácil alteração)
-- ============================================================================
local cor_principal = '#00FF2B' -- Verde Matrix
local cor_labels    = 'grey'    -- Cor dos textos estáticos
local fonte_padrao  = 'DejaVu Sans Mono:size=12'

conky.config = {
--  Configurações de Janela e Alinhamento
    alignment = 'top_left',
    own_window = true,
    own_window_class = 'Conky',
    own_window_type = 'desktop',
    own_window_transparent = true,
    own_window_argb_visual = true,
    own_window_argb_value = 0,
    double_buffer = true,

--  Dimensões e Posição (Largura ajustada para os gráficos)
    minimum_width = 450,
    minimum_height = 600,
    gap_x = 60,
    gap_y = 60,

--  Desempenho e Atualização
    update_interval = 1.5,
    cpu_avg_samples = 2,
    net_avg_samples = 2,
    no_buffers = true,

--  Gráficos e Fontes
    font = fonte_padrao,
    default_color = cor_principal,
    draw_borders = false,
    draw_graph_borders = true,
    use_xft = true,
}

conky.text = [[
#--  ===========================================================================
#--  SISTEMA E UPTIME
#--  ===========================================================================
${color grey}Info:$color ${scroll 32 Conky $conky_version - $sysname $nodename $kernel $machine}
$hr
${color grey}Uptime:$color $uptime
${color grey}Frequency (in MHz):$color $freq
${color grey}Frequency (in GHz):$color $freq_g

#--  ===========================================================================
#--  HARDWARE (RAM, CPU, SWAP)
#--  ===========================================================================
${color grey}RAM Usage:$color $mem/$memmax - $memperc%
${membar 4}
${color grey}Swap Usage:$color $swap/$swapmax - $swapperc%
${swapbar 4}

${color grey}CPU Usage:$color $cpu%
${cpugraph 40,450 00FF2B 00FF2B}
${color grey}Processes:$color $processes  ${color grey}Running:$color $running_processes
$hr

#--  ===========================================================================
#--  ARMAZENAMENTO E REDE
#--  ===========================================================================
${color grey}File systems:
 / $color${fs_used /}/${fs_size /} ${fs_bar 6 /}

${color grey}Networking:
Up:$color ${upspeed} ${goto 220}${color grey}Down:$color ${downspeed}
${upspeedgraph 30,210 00FF2B 00FF2B} ${goto 220}${downspeedgraph 30,210 00FF2B 00FF2B}
$hr

#--  ===========================================================================
#--  TABELA DE PROCESSOS (ALINHADA)
#--  ===========================================================================
${color grey}Name${goto 200}PID${goto 280}CPU%${goto 360}MEM%
$color ${top name 1}${goto 200}${top pid 1}${goto 280}${top cpu 1}${goto 360}${top mem 1}
$color ${top name 2}${goto 200}${top pid 2}${goto 280}${top cpu 2}${goto 360}${top mem 2}
$color ${top name 3}${goto 200}${top pid 3}${goto 280}${top cpu 3}${goto 360}${top mem 3}
$color ${top name 4}${goto 200}${top pid 4}${goto 280}${top cpu 4}${goto 360}${top mem 4}
$color ${top name 5}${goto 200}${top pid 5}${goto 280}${top cpu 5}${goto 360}${top mem 5}
$color ${top name 6}${goto 200}${top pid 6}${goto 280}${top cpu 6}${goto 360}${top mem 6}
$color ${top name 7}${goto 200}${top pid 7}${goto 280}${top cpu 7}${goto 360}${top mem 7}
$color ${top name 8}${goto 200}${top pid 8}${goto 280}${top cpu 8}${goto 360}${top mem 8}
$color ${top name 9}${goto 200}${top pid 9}${goto 280}${top cpu 9}${goto 360}${top mem 9}
$color ${top name 10}${goto 200}${top pid 10}${goto 280}${top cpu 10}${goto 360}${top mem 10}
]]

